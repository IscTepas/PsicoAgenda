schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Language: es
  All artifacts must be written in Spanish.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Domain: psychology practice management (appointments, clinical records, notifications, reports).
  Project: PsicoAgenda — multiplatform application for psychologists and patients.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Nombra el change con el prefijo `YYYY-MM-DD-` seguido de un nombre en kebab-case
      (por ejemplo `2026-09-28-migrar-a-supabase`). `openspec new change` no antepone
      la fecha, y el prefijo es lo que da orden cronológico en `openspec/changes/archive/`.
      La fecha también queda en el campo `created:` del `.openspec.yaml`.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
