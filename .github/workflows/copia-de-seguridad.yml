# Copia diaria cifrada de la base (ticket 2026-10-28-copias-de-seguridad-de-datos-clinicos).
# Una ejecución en rojo (credencial inválida, pg_dump falla, subida rechazada) llega por correo.
# shortcut: si el workflow deja de ejecutarse (repo inactivo 60 días) no hay alerta de "copia ausente"; revisar el bucket una vez al mes.
name: Copia de seguridad

on:
  schedule:
    - cron: "17 9 * * *" # 03:17 en Tepic, fuera del horario de consulta
  workflow_dispatch:

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar pg_dump 17 y age
        # pg_dump debe ser igual o más nuevo que el servidor; el 17 de PGDG cubre Supabase 15 y 17.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Copiar, cifrar y subir
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          BACKUP_S3_URI: ${{ vars.BACKUP_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET }}
          AWS_ENDPOINT_URL: ${{ vars.BACKUP_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
        run: bash PsicoAgenda/scripts/backup-db.sh
